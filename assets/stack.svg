  <g transform="translate(-270 -153)"><rect width="94" height="38" rx="12" fill="#122847" stroke="#247bff"/><text x="47" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Java</text></g>
  <g transform="translate(-30 -151)"><rect width="70" height="38" rx="12" fill="#122847" stroke="#247bff"/><text x="35" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">C</text></g>
  <g transform="translate(200 -153)"><rect width="124" height="38" rx="12" fill="#122847" stroke="#ff354f"/><text x="62" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Flask</text></g>
  <g transform="translate(360 -58)"><rect width="126" height="38" rx="12" fill="#122847" stroke="#ff354f"/><text x="63" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">JavaScript</text></g>
  <g transform="translate(-390 82)"><rect width="128" height="38" rx="12" fill="#122847" stroke="#ff354f"/><text x="64" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Machine Learning</text></g>
  <g transform="translate(-200 133)"><rect width="126" height="38" rx="12" fill="#122847" stroke="#247bff"/><text x="63" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Deep Learning</text></g>
  <g transform="translate(40 145)"><rect width="128" height="38" rx="12" fill="#122847" stroke="#247bff"/><text x="64" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Generative AI</text></g>
  <g transform="translate(260 86)"><rect width="124" height="38" rx="12" fill="#122847" stroke="#ff354f"/><text x="62" y="25" text-anchor="middle" fill="#eaf1ff" font-size="16">Google Cloud</text></g>
 </g>
