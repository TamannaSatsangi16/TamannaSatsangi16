  <rect x="519" width="110" height="30" rx="9" fill="#17243a"/><text x="574" y="20" text-anchor="middle" class="white">Robotics</text>
  <rect x="640" width="212" height="30" rx="9" fill="#17243a"/><text x="746" y="20" text-anchor="middle" class="white">Data Structures &amp; Algorithms</text>
